name: CI

# Runs on every push to any branch, and on every PR targeting main. PRs are
# included so a broken build is caught BEFORE merge, not after.
on:
  push:
  pull_request:
    branches: [main]

# A fake-but-valid DATABASE_URL is required at the job level: Prisma's CLI
# (`validate`, `generate`) reads schema.prisma, which references
# env("DATABASE_URL") in the datasource block. Neither command actually
# connects to this database - they only need the env var to be *defined* so
# schema parsing doesn't throw "environment variable not found". No real
# Postgres instance is started in this workflow.
env:
  DATABASE_URL: "postgresql://ci_user:ci_password@localhost:5432/ci_db?schema=public"

jobs:
  # ===========================================================================
  # BACKEND: install -> lint -> generate Prisma client -> validate schema ->
  # compile TypeScript. Runs independently of the frontend job so a backend
  # failure is reported without waiting on/blocking the frontend, and vice
  # versa - they run in parallel by default since neither declares `needs`.
  # ===========================================================================
  backend:
    name: Backend (Lint, Prisma, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Caches ~/.npm keyed on this lockfile's hash - subsequent runs
          # with unchanged dependencies skip re-downloading npm packages.
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      # npm ci (not npm install) is deliberate: it installs EXACTLY what's
      # in package-lock.json and fails outright if the lockfile is out of
      # sync with package.json, instead of silently rewriting the lockfile.
      # That's what you want in CI - reproducible installs.
      - name: Install dependencies
        run: npm ci

      # Fails the workflow on any lint error (see eslint.config.mjs) -
      # ESLint's process exit code is non-zero whenever an error is found,
      # which GitHub Actions treats as a failed step automatically.
      - name: Lint
        run: npm run lint

      # Generates node_modules/.prisma/client - the typed query client the
      # rest of the backend imports as "@prisma/client". Must run before
      # `tsc`, since compiled code references types this step creates.
      - name: Generate Prisma Client
        run: npx prisma generate

      # Statically checks prisma/schema.prisma for syntax errors and invalid
      # relations WITHOUT connecting to a real database. Catches a broken
      # schema at CI time instead of at deploy time.
      - name: Validate Prisma schema
        run: npx prisma validate

      # Compiles src/**/*.ts -> dist/**/*.js. This is the same command the
      # production Dockerfile's "builder" stage runs - if this fails, the
      # Docker image build later in this workflow would have failed too.
      - name: Build backend (TypeScript)
        run: npm run build

  # ===========================================================================
  # FRONTEND: install -> lint -> build. Mirrors the backend job's structure.
  # ===========================================================================
  frontend:
    name: Frontend (Lint, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs "tsc -b && vite build" (client/package.json, unchanged) -
      # type-checks the whole client project, then produces the production
      # static bundle in client/dist/.
      - name: Build frontend
        run: npm run build

  # ===========================================================================
  # DOCKER: builds the actual production images from the Phase 1 Dockerfiles.
  # Depends on both jobs above (`needs`) - there is no point spending time
  # building Docker images from source that doesn't even compile or pass
  # lint. This job proves the Dockerfiles themselves are correct; it does
  # NOT push images anywhere (no registry credentials configured here) - add
  # a `docker/login-action` + `push: true` step once you have a registry
  # (Docker Hub / GHCR / ECR) to publish to.
  # ===========================================================================
  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Enables BuildKit features (layer caching, better build output) that
      # plain `docker build` doesn't have by default on GitHub's runners.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: quillpen-backend:${{ github.sha }}
          # GitHub Actions' own cache backend - speeds up rebuilds by
          # reusing unchanged Docker layers (e.g. the npm ci layer) between
          # workflow runs instead of rebuilding them from scratch every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: quillpen-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
