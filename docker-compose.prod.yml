# =============================================================================
# PRODUCTION compose file.
# Run with:  docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (dev):
#  - Uses the multi-stage production Dockerfiles (compiled JS / static nginx
#    build) instead of Dockerfile.dev.
#  - No source bind mounts - images are immutable; a code change means a new
#    image build and deploy, not a live-edited container.
#  - Database/cache ports are NOT published to the host by default - only the
#    frontend (80) and backend (5000) are reachable from outside the Docker
#    network, reducing attack surface. Uncomment the ports if you need direct
#    external DB/Redis access (e.g. running migrations from your laptop
#    against a remote host).
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: quillpen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-quillpen}
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - quillpen-network

  redis:
    image: redis:7-alpine
    container_name: quillpen-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - quillpen-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quillpen-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-quillpen}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env for production}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - quillpen-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: quillpen-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
    networks:
      - quillpen-network

networks:
  quillpen-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
