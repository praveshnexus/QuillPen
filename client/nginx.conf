server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text-based assets - meaningfully reduces transfer size for JS/CSS
    # bundles with near-zero CPU cost.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Hashed, immutable build assets (Vite appends a content hash to
    # filenames) can be cached by the browser forever - a new deploy
    # produces new filenames, so there's no staleness risk.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router uses client-side (browser history) routing. If a user
    # refreshes the page on e.g. /post/my-first-post, nginx has no physical
    # file at that path. try_files falls back to index.html so React Router
    # takes over and renders the right page client-side, instead of nginx
    # returning its own 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
